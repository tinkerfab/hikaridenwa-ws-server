<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>ひかり電話 着信ビューア</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <div class="header__brand">
      <span class="header__icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.36 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </span>
      <h1>ひかり電話 着信ビューア</h1>
    </div>
    <span id="connection-status" class="status status--connecting">接続中...</span>
  </header>
  <div class="page">
    <p class="hint-banner">
      このページの着信履歴はブラウザ内(localStorage)にのみ保存されます。サーバは履歴を保持しないため、他の端末とは同期されません。
    </p>
    <main id="call-list" aria-live="polite"></main>
  </div>
  <template id="call-card-template">
    <article class="call-card">
      <div class="call-card__header">
        <span class="call-card__number"></span>
        <span class="call-card__badge"></span>
      </div>
      <div class="call-card__display-name"></div>
      <time class="call-card__time"></time>
    </article>
  </template>
  <script src="/static/app.js"></script>
</body>
</html>
